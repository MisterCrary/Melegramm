<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Melegramm · Telegram стиль</title>
    <style>
        :root { --bg: #0e1621; --side: #17212b; --item-hover: #232e3c; --accent: #2481cc; --text: #fff; --msg-in: #182533; --msg-out: #2b5278; --search-bg: #242f3d; --danger: #ff4444; --success: #2ecc71; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideLeft { 0% { transform: translateX(20px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        .fade-slide { animation: fadeSlide 0.25s ease; }
        .pop-in { animation: popIn 0.2s ease-out; }
        
        #sidebar { width: 100%; max-width: 350px; background: var(--side); display: flex; flex-direction: column; border-right: 1px solid #000; z-index: 10; }
        .side-header { padding: 15px; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
        .search-area { padding: 10px 15px; }
        .search-area input { width: 100%; padding: 12px; border-radius: 22px; border: none; background: var(--search-bg); color: white; outline: none; }
        .chat-list { overflow-y: auto; flex-grow: 1; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; transition: 0.2s; animation: fadeSlide 0.2s; }
        .chat-item:hover { background: var(--item-hover); }
        .chat-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .chat-item .info { flex-grow: 1; }
        .chat-item .name { font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .chat-item .sub { font-size: 13px; color: #7f91a4; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 12px; background: var(--accent); color: white; }
        .badge.group { background: #2ecc71; }
        .badge.channel { background: #e67e22; }
        
        #chat-main { flex-grow: 1; display: flex; flex-direction: column; background: #070d14 url('https://web.telegram.org/k/assets/img/chat-bg-pattern.4d3ec7a5.png'); background-size: cover; }
        .chat-header { background: var(--side); padding: 10px 15px; display: flex; align-items: center; gap: 15px; }
        .back-btn { display: none; font-size: 24px; color: var(--accent); cursor: pointer; }
        #messages-cont { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 15px; word-wrap: break-word; animation: popIn 0.2s; position: relative; }
        .bubble.mine { align-self: flex-end; background: var(--msg-out); border-bottom-right-radius: 4px; }
        .bubble.theirs { align-self: flex-start; background: var(--msg-in); border-bottom-left-radius: 4px; }
        .bubble img { max-width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; }
        .bubble audio { height: 40px; max-width: 200px; margin-top: 5px; }
        .bubble .sender-name { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 4px; }
        .msg-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
        .msg-actions button { background: rgba(0,0,0,0.3); border: none; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .msg-actions button:hover { background: var(--accent); }
        .input-panel { padding: 12px 15px; background: var(--side); display: flex; align-items: center; gap: 10px; }
        .input-panel input { flex-grow: 1; padding: 12px 18px; border-radius: 30px; border: none; background: var(--search-bg); color: white; outline: none; }
        .action-btn { background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; width: 44px; height: 44px; border-radius: 30px; transition: 0.15s; }
        .action-btn:hover { background: rgba(36,129,204,0.2); }
        .action-btn.recording { color: #ff4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .modal { position: fixed; inset: 0; background: rgba(14,22,33,0.95); backdrop-filter: blur(8px); z-index: 100; display: none; padding: 20px; align-items: center; justify-content: center; }
        .set-card { background: var(--side); padding: 25px; border-radius: 28px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.5); animation: popIn 0.25s; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1f2c38; color: white; padding: 12px 24px; border-radius: 50px; z-index: 9999; animation: fadeSlide 0.3s; }
        .add-contact-area { padding: 15px; border-top: 1px solid #1c262f; margin-top: auto; }
        .add-contact-area input { width: 100%; padding: 12px; border-radius: 22px; border: none; background: var(--search-bg); color: white; margin-bottom: 8px; }
        .add-contact-area button { width: 100%; padding: 10px; border-radius: 22px; background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
        .context-menu { position: fixed; background: var(--side); border-radius: 16px; padding: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); z-index: 2000; display: none; min-width: 180px; }
        .context-item { padding: 12px 16px; cursor: pointer; border-radius: 12px; color: white; }
        .context-item:hover { background: var(--item-hover); }
        .context-item.danger { color: #ff6b6b; }
        
        @media (max-width: 768px) {
            #sidebar { position: fixed; inset: 0; max-width: none; }
            #chat-main { position: fixed; inset: 0; transform: translateX(100%); transition: transform 0.3s; z-index: 20; }
            body.chat-open #chat-main { transform: translateX(0); }
            .back-btn { display: block; }
        }
        .hidden { display: none !important; }
        textarea { width: 100%; padding: 14px; border-radius: 20px; border: none; background: var(--search-bg); color: white; resize: none; font-family: inherit; }
    </style>
</head>
<body>
    <!-- Auth overlay -->
<div id="auth-overlay" class="modal" style="display: flex; background: #0e1621;">
    <div class="set-card">
        <h2 style="color:var(--accent); margin-bottom:20px;">✨ Melegramm</h2>
        <input type="text" id="auth-log" placeholder="Придумайте логин" style="width:100%; padding:14px; margin-bottom:12px; border-radius:40px; border:none; background:var(--search-bg); color:white;">
        <input type="password" id="auth-pass" placeholder="Пароль" style="width:100%; padding:14px; margin-bottom:20px; border-radius:40px; border:none; background:var(--search-bg); color:white;">
        <button onclick="handleAuth('login')" style="width:100%; padding:14px; border-radius:40px; background:var(--accent); color:white; font-weight:bold;">ВОЙТИ</button>
        <p onclick="handleAuth('reg')" style="color:var(--accent); margin-top:20px; cursor:pointer;">Новый аккаунт? Создать</p>
    </div>
</div>

<!-- Settings -->
<div id="settings-page" class="modal">
    <div class="set-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <button onclick="closeSettings()" style="color:var(--accent); background:none; border:none; font-size:22px;">←</button>
            <h3>Профиль</h3><div style="width:20px;"></div>
        </div>
        <label for="ava-upload" style="cursor:pointer;">
            <img id="set-ava" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:110px; height:110px; border-radius:50%; object-fit:cover; border:3px solid var(--accent);">
        </label>
        <input type="file" id="ava-upload" accept="image/*" style="display:none;">
        <h2 id="set-name">...</h2>
        <p style="color:#7f91a4;">@<span id="set-at">...</span></p>
        <p id="set-bio" style="color:#7f91a4; font-size:14px; margin:5px 0;">...</p>
        <button onclick="openEditProfile()" style="width:100%; padding:12px; margin:10px 0; border-radius:40px; background:var(--accent); color:white; border:none; font-weight:bold;">✏️ Изменить профиль</button>
        <button onclick="copyAtLink()" style="width:100%; padding:12px; margin-bottom:10px; border-radius:40px; background:var(--success); color:white; border:none; font-weight:bold;">📋 Скопировать @</button>
        <button onclick="logout()" style="width:100%; padding:12px; border-radius:40px; color:#ff6b6b; background:rgba(255,68,68,0.1); border:1px solid #ff6b6b;">🚪 Выйти</button>
    </div>
</div>

<!-- Edit Profile Modal -->
<div id="edit-profile-modal" class="modal">
    <div class="set-card">
        <h3>✏️ Редактировать профиль</h3>
        <input type="text" id="edit-username" placeholder="Имя" style="width:100%; padding:14px; margin:15px 0; border-radius:40px; border:none; background:var(--search-bg); color:white;">
        <input type="text" id="edit-at" placeholder="@username" style="width:100%; padding:14px; margin-bottom:10px; border-radius:40px; border:none; background:var(--search-bg); color:white;">
        <textarea id="edit-bio" placeholder="О себе (bio)" style="margin-bottom:20px; height:80px;"></textarea>
        <button onclick="saveProfileChanges()" style="background:var(--accent); width:100%; padding:14px; border-radius:40px; border:none; color:white; font-weight:bold;">💾 Сохранить</button>
        <button onclick="closeEditProfile()" style="margin-top:12px; background:transparent; border:1px solid #777; width:100%; padding:12px; border-radius:40px; color:#ccc;">Отмена</button>
    </div>
</div>

<!-- Create Group/Channel Modal -->
<div id="create-chat-modal" class="modal">
    <div class="set-card">
        <h3 id="create-modal-title">👥 Новая группа</h3>
        <input type="text" id="new-chat-name" placeholder="Название" style="width:100%; padding:14px; margin:15px 0; border-radius:40px; border:none; background:var(--search-bg); color:white;">
        <textarea id="new-chat-desc" placeholder="Описание (необязательно)" style="margin-bottom:15px; height:80px;"></textarea>
        <label for="chat-ava-upload" style="cursor:pointer; display:block; margin-bottom:15px;">
            <img id="chat-ava-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:60px; height:60px; border-radius:50%; object-fit:cover;">
            <span style="color:var(--accent); margin-left:10px;">📷 Загрузить фото</span>
        </label>
        <input type="file" id="chat-ava-upload" accept="image/*" style="display:none;">
        <button onclick="createChat()" id="create-chat-btn" style="background:var(--success); width:100%; padding:14px; border-radius:40px; color:white; font-weight:bold;">✅ Создать</button>
        <button onclick="closeCreateChat()" style="margin-top:12px; background:transparent; border:1px solid #777; width:100%; padding:12px; border-radius:40px; color:#ccc;">Отмена</button>
    </div>
</div>

<!-- Chat Info Modal -->
<div id="chat-info-modal" class="modal">
    <div class="set-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <button onclick="closeChatInfo()" style="color:var(--accent); background:none; border:none; font-size:22px;">←</button>
            <h3>Информация</h3><div style="width:20px;"></div>
        </div>
        <img id="info-ava" src="" style="width:100px; height:100px; border-radius:50%; object-fit:cover; margin-bottom:10px;">
        <h2 id="info-name"></h2>
        <p id="info-desc" style="color:#7f91a4; margin-bottom:20px;"></p>
        <button onclick="editChatInfo()" style="background:var(--accent); width:100%; padding:12px; border-radius:40px; color:white; border:none; font-weight:bold; margin-bottom:10px;">✏️ Изменить</button>
        <button onclick="leaveChat()" style="background:var(--danger); width:100%; padding:12px; border-radius:40px; color:white; border:none; font-weight:bold;">🚪 Покинуть</button>
    </div>
</div>

<!-- Sidebar -->
<div id="sidebar">
    <div class="side-header">
        <span onclick="openSettings()" style="cursor:pointer;">☰</span>
        <span style="flex-grow:1;">Melegramm</span>
        <span onclick="openCreateMenu()" style="cursor:pointer; color:var(--accent); font-size:24px;">+</span>
    </div>
    <div class="search-area"><input type="text" placeholder="🔍 Поиск..." id="search-input"></div>
    <div class="chat-list" id="list-cont"></div>
    <div class="add-contact-area">
        <input type="text" id="add-contact-input" placeholder="Введите @username">
        <button onclick="addContactByAt()">➕ Добавить контакт</button>
    </div>
</div>

<!-- Create Menu -->
<div id="create-menu" class="context-menu" style="position:absolute; top:60px; right:15px;">
    <div class="context-item" onclick="showCreateGroup()">👥 Новая группа</div>
    <div class="context-item" onclick="showCreateChannel()">📢 Новый канал</div>
</div>

<!-- Chat Main -->
<div id="chat-main">
    <div class="chat-header">
        <span class="back-btn" onclick="closeChat()">←</span>
        <img id="h-ava" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:42px; height:42px; border-radius:50%; cursor:pointer;" onclick="showChatInfo()">
        <div style="flex-grow:1; cursor:pointer;" onclick="showChatInfo()">
            <span id="h-name" style="font-weight:bold;">Выберите чат</span>
            <div style="font-size:13px; color:var(--accent);" id="h-subtitle"></div>
        </div>
        <span onclick="makeCall()" style="cursor:pointer; font-size:22px;">📞</span>
        <span onclick="makeVideoCall()" style="cursor:pointer; font-size:22px; margin-left:5px;">📹</span>
        <span onclick="showChatInfo()" style="cursor:pointer; font-size:22px; margin-left:5px;">ℹ️</span>
    </div>
    <div id="messages-cont" onclick="hideContextMenu()"></div>
    <div class="input-panel">
        <button class="action-btn" onclick="document.getElementById('f-up').click()">📎</button>
        <input type="file" id="f-up" class="hidden" accept="image/*,video/*">
        <input type="text" id="m-field" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMsg('text')">
        <button id="mic-btn" class="action-btn" onclick="toggleRecord()">🎤</button>
        <button class="action-btn" onclick="sendMsg('text')">🚀</button>
    </div>
</div>

<!-- Context Menu for Messages -->
<div id="msg-context" class="context-menu"></div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB_Nmuf7Mk3W91GcQ7Qo_1vHnVvSZNtFhA",
        authDomain: "melegrammservers.firebaseapp.com",
        projectId: "melegrammservers",
        storageBucket: "melegrammservers.firebasestorage.app",
        messagingSenderId: "54909599250",
        appId: "1:54909599250:web:73b6101eed13b98cc2e2cb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const IMGBB_KEY = "2db2f272dc9f0b69bd8874f377be5439";
    
    setPersistence(auth, browserLocalPersistence);
    
    let me = null, activeChat = null, activeChatType = null, activeChatData = null, contacts = [], allChats = [], unsubMsgs;
    let recorder, audioChunks = [], currentChatMode = 'group'; // 'group' or 'channel'

    window.showToast = (text) => { 
        const t = document.createElement('div'); t.className = 'toast'; t.innerText = text; 
        document.body.appendChild(t); setTimeout(() => t.remove(), 2500); 
    };
    
    window.hideContextMenu = () => document.getElementById('msg-context').style.display = 'none';
    window.copyAtLink = () => { if(me) { navigator.clipboard?.writeText(`@${me.at}`); showToast(`@${me.at} скопирован!`); } };

    window.handleAuth = async (mode) => {
        const login = document.getElementById('auth-log').value.trim();
        const password = document.getElementById('auth-pass').value;
        if(login.length < 3) return showToast("Логин от 3 символов");
        if(password.length < 6) return showToast("Пароль от 6 символов");
        const email = `${login}@melegramm.local`;
        try {
            if(mode === 'reg') {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                const at = login + Math.floor(Math.random() * 1000);
                await setDoc(doc(db, "users", userCred.user.uid), { 
                    username: login, at, uid: userCred.user.uid, bio: 'Привет! Я использую Melegramm.',
                    ava: `https://ui-avatars.com/api/?name=${login}&background=random&color=fff`, contacts: [] 
                });
                showToast("Аккаунт создан!");
            } else {
                await signInWithEmailAndPassword(auth, email, password);
                showToast("Вход выполнен!");
            }
        } catch(e) {
            if(e.code === 'auth/email-already-in-use') showToast("Логин занят!");
            else if(e.code === 'auth/wrong-password') showToast("Неверный пароль!");
            else if(e.code === 'auth/user-not-found') showToast("Аккаунт не найден!");
            else showToast("Ошибка: " + e.message);
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            let userDoc = await getDoc(doc(db, "users", user.uid));
            if(!userDoc.exists()) {
                const login = user.email.split('@')[0];
                const at = login + Math.floor(Math.random() * 1000);
                await setDoc(doc(db, "users", user.uid), {
                    username: login, at, uid: user.uid, bio: 'Привет! Я использую Melegramm.',
                    ava: `https://ui-avatars.com/api/?name=${login}&background=random&color=fff`, contacts: []
                });
                userDoc = await getDoc(doc(db, "users", user.uid));
            }
            me = userDoc.data();
            contacts = me.contacts || [];
            document.getElementById('auth-overlay').style.display = 'none';
            updateProfileUI();
            listenContactsAndChats();
        } else {
            document.getElementById('auth-overlay').style.display = 'flex';
        }
    });

    function updateProfileUI() { 
        if(me) { 
            document.getElementById('set-ava').src = me.ava; 
            document.getElementById('set-name').innerText = me.username; 
            document.getElementById('set-at').innerText = me.at; 
            document.getElementById('set-bio').innerText = me.bio || ''; 
        } 
    }

    document.getElementById('ava-upload').onchange = async (e) => {
        const file = e.target.files[0]; if(!file) return;
        showToast("Загрузка...");
        const fd = new FormData(); fd.append('image', file);
        const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd });
        const d = await r.json();
        if(d.success) { me.ava = d.data.url; await updateDoc(doc(db,"users",me.uid), {ava: me.ava}); updateProfileUI(); showToast("Аватар обновлён!"); }
    };

    window.openSettings = () => document.getElementById('settings-page').style.display = 'flex';
    window.closeSettings = () => document.getElementById('settings-page').style.display = 'none';
    window.openEditProfile = () => { 
        document.getElementById('edit-username').value = me.username; 
        document.getElementById('edit-at').value = me.at; 
        document.getElementById('edit-bio').value = me.bio || ''; 
        document.getElementById('edit-profile-modal').style.display = 'flex'; 
    };
    window.closeEditProfile = () => document.getElementById('edit-profile-modal').style.display = 'none';
    
    window.saveProfileChanges = async () => {
        const newName = document.getElementById('edit-username').value.trim();
        let newAt = document.getElementById('edit-at').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
        const newBio = document.getElementById('edit-bio').value.trim();
        if(!newName) return showToast("Введите имя");
        if(!newAt) return showToast("Введите @");
        const exists = await getDocs(query(collection(db,"users"), where("at","==",newAt)));
        if(!exists.empty && exists.docs[0].id !== me.uid) return showToast("Этот @ занят!");
        await updateDoc(doc(db,"users",me.uid), { username: newName, at: newAt, bio: newBio });
        me.username = newName; me.at = newAt; me.bio = newBio;
        updateProfileUI(); closeEditProfile(); showToast("Профиль обновлён!");
    };

    window.logout = async () => { await signOut(auth); me = null; showToast("Вы вышли"); };
        // Создание групп/каналов
    window.openCreateMenu = () => { const m = document.getElementById('create-menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; };
    window.showCreateGroup = () => { currentChatMode = 'group'; document.getElementById('create-modal-title').innerText = '👥 Новая группа'; document.getElementById('create-chat-btn').style.background = '#2ecc71'; document.getElementById('create-chat-modal').style.display = 'flex'; document.getElementById('create-menu').style.display = 'none'; };
    window.showCreateChannel = () => { currentChatMode = 'channel'; document.getElementById('create-modal-title').innerText = '📢 Новый канал'; document.getElementById('create-chat-btn').style.background = '#e67e22'; document.getElementById('create-chat-modal').style.display = 'flex'; document.getElementById('create-menu').style.display = 'none'; };
    window.closeCreateChat = () => { document.getElementById('create-chat-modal').style.display = 'none'; document.getElementById('new-chat-name').value = ''; document.getElementById('new-chat-desc').value = ''; };
    
    let tempChatAva = null;
    document.getElementById('chat-ava-upload').onchange = async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const fd = new FormData(); fd.append('image', file);
        const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd });
        const d = await r.json();
        if(d.success) { document.getElementById('chat-ava-preview').src = d.data.url; tempChatAva = d.data.url; }
    };

    window.createChat = async () => {
        const name = document.getElementById('new-chat-name').value.trim();
        const desc = document.getElementById('new-chat-desc').value.trim();
        if(!name) return showToast("Введите название");
        const ava = tempChatAva || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=${currentChatMode==='group'?'2ecc71':'e67e22'}&color=fff`;
        const ref = doc(collection(db, "chats"));
        const data = { id: ref.id, name, description: desc, ava, type: currentChatMode, owner: me.uid, createdAt: serverTimestamp() };
        if(currentChatMode === 'group') data.members = [me.uid];
        else data.subscribers = [me.uid];
        await setDoc(ref, data);
        closeCreateChat(); showToast(`${currentChatMode==='group'?'Группа':'Канал'} создан!`);
        tempChatAva = null; document.getElementById('chat-ava-preview').src = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
    };

    // Контакты и чаты
    window.addContactByAt = async () => {
        const val = document.getElementById('add-contact-input').value.trim().replace('@','').toLowerCase();
        if(!val) return showToast("Введите @");
        const q = query(collection(db,"users"), where("at","==",val));
        const snap = await getDocs(q);
        if(snap.empty) return showToast("Пользователь не найден");
        const user = snap.docs[0].data();
        if(user.uid === me.uid) return showToast("Это вы!");
        if(contacts.includes(user.uid)) return showToast("Уже в контактах");
        contacts.push(user.uid);
        await updateDoc(doc(db,"users",me.uid), { contacts });
        document.getElementById('add-contact-input').value = '';
        showToast(`${user.username} добавлен!`);
    };

    function listenContactsAndChats() {
        onSnapshot(doc(db, "users", me.uid), (snap) => { if(snap.exists()) { contacts = snap.data().contacts || []; renderChats(); } });
        onSnapshot(collection(db, "chats"), (snap) => { allChats = []; snap.forEach(d => allChats.push({id: d.id, ...d.data()})); renderChats(); });
        document.getElementById('search-input').oninput = (e) => renderChats(e.target.value.toLowerCase());
    }

    async function renderChats(filter = '') {
        const c = document.getElementById('list-cont');
        let html = `<div class="chat-item" onclick="openSaved()"><img src="https://cdn-icons-png.flaticon.com/512/566/566412.png"><div class="info"><div class="name">⭐ Избранное</div><div class="sub">Сохранённые сообщения</div></div></div>`;
        for(let uid of contacts) {
            const u = await getDoc(doc(db,"users",uid)).then(d => d.data());
            if(!u) continue;
            if(filter && !u.username.toLowerCase().includes(filter) && !u.at?.includes(filter)) continue;
            html += `<div class="chat-item" onclick="openPrivateChat('${u.uid}','${u.username}','${u.ava}','${u.bio||''}')"><img src="${u.ava}"><div class="info"><div class="name">${u.username}</div><div class="sub">${u.bio?.substring(0,30)||'@'+u.at}</div></div></div>`;
        }
        allChats.filter(chat => (chat.members?.includes(me.uid) || chat.subscribers?.includes(me.uid)) && (!filter || chat.name.toLowerCase().includes(filter))).forEach(chat => {
            const badge = chat.type === 'group' ? '<span class="badge group">группа</span>' : '<span class="badge channel">канал</span>';
            html += `<div class="chat-item" onclick="openChat('${chat.id}','${chat.name}','${chat.ava}','${chat.type}')"><img src="${chat.ava}"><div class="info"><div class="name">${chat.name} ${badge}</div><div class="sub">${chat.description?.substring(0,30)||''}</div></div></div>`;
        });
        c.innerHTML = html;
    }

    window.openSaved = () => openChat(`saved_${me.uid}`, '⭐ Избранное', 'https://cdn-icons-png.flaticon.com/512/566/566412.png', 'saved');
    window.openPrivateChat = (uid, name, ava, bio) => openChat(me.uid < uid ? `${me.uid}_${uid}` : `${uid}_${me.uid}`, name, ava, 'private', { bio });
    
    window.openChat = async (id, name, ava, type, extra = {}) => {
        activeChat = id; activeChatType = type;
        if(type !== 'private' && type !== 'saved') {
            activeChatData = allChats.find(c => c.id === id) || (await getDoc(doc(db, "chats", id))).data();
        }
        document.getElementById('h-name').innerText = name;
        document.getElementById('h-ava').src = ava;
        document.getElementById('h-subtitle').innerText = type === 'group' ? '👥 Группа' : type === 'channel' ? '📢 Канал' : extra.bio || 'онлайн';
        document.body.classList.add('chat-open');
        listenMsgs();
    };
    
    window.closeChat = () => { document.body.classList.remove('chat-open'); activeChat = null; if(unsubMsgs) unsubMsgs(); };
    window.showChatInfo = () => {
        if(!activeChat) return;
        const info = activeChatData || { name: document.getElementById('h-name').innerText, ava: document.getElementById('h-ava').src, description: '' };
        document.getElementById('info-ava').src = info.ava;
        document.getElementById('info-name').innerText = info.name;
        document.getElementById('info-desc').innerText = info.description || 'Нет описания';
        document.getElementById('chat-info-modal').style.display = 'flex';
    };
    window.closeChatInfo = () => document.getElementById('chat-info-modal').style.display = 'none';
    window.editChatInfo = () => { closeChatInfo(); showToast("Редактирование в разработке"); };
    window.leaveChat = async () => { if(confirm("Покинуть чат?")) { /* логика выхода */ closeChatInfo(); showToast("Вы покинули чат"); } };
    
    window.makeCall = () => showToast(`📞 Звонок ${document.getElementById('h-name').innerText}... (имитация)`);
    window.makeVideoCall = () => showToast(`📹 Видеозвонок ${document.getElementById('h-name').innerText}... (имитация)`);

    function listenMsgs() {
        if(unsubMsgs) unsubMsgs();
        if(!activeChat) return;
        const roomId = (activeChatType === 'private' || activeChatType === 'saved') ? activeChat : `chat_${activeChat}`;
        const q = query(collection(db, "rooms", roomId, "msgs"), orderBy("time", "asc"));
        unsubMsgs = onSnapshot(q, async (s) => {
            const mC = document.getElementById('messages-cont'); mC.innerHTML = "";
            for(let d of s.docs) {
                const m = d.data(); m.id = d.id;
                const isMe = m.uid === me?.uid;
                let senderName = '';
                if(!isMe && activeChatType === 'group') {
                    const u = (await getDoc(doc(db,"users",m.uid))).data();
                    senderName = u?.username || 'Участник';
                }
                let content = m.type === 'img' ? `<img src="${m.val}" onclick="showImage('${m.val}')">` : 
                             m.type === 'voice' ? `<audio controls src="${m.val}"></audio>` : 
                             m.type === 'video' ? `<video controls src="${m.val}" style="max-width:100%; border-radius:12px;"></video>` : m.val;
                const senderHtml = senderName ? `<div class="sender-name">${senderName}</div>` : '';
                const actions = `<div class="msg-actions">
                    <button onclick="copyMsg('${m.val.replace(/'/g,"\\'")}')">📋</button>
                    ${isMe ? `<button onclick="editMsg('${m.id}','${m.val.replace(/'/g,"\\'")}')">✏️</button><button onclick="deleteMsg('${m.id}')">🗑️</button>` : ''}
                </div>`;
                mC.innerHTML += `<div class="bubble ${isMe ? 'mine' : 'theirs'}" oncontextmenu="showMsgContext(event,'${m.id}','${isMe}')">${senderHtml}${content}${actions}</div>`;
            }
            mC.scrollTop = mC.scrollHeight;
        });
    }

    window.showImage = (url) => window.open(url, '_blank');
    window.showMsgContext = (e, id, isMe) => { e.preventDefault(); /* контекстное меню */ };

    window.sendMsg = async (type, val = null) => {
        const f = document.getElementById('m-field'); const v = val || f.value.trim();
        if(!v && type==='text') return; if(!activeChat) return showToast("Выберите чат!");
        const roomId = (activeChatType === 'private' || activeChatType === 'saved') ? activeChat : `chat_${activeChat}`;
        await addDoc(collection(db, "rooms", roomId, "msgs"), { val: v, uid: me.uid, type, time: serverTimestamp() });
        if(type==='text') f.value = "";
    };

    window.deleteMsg = async (id) => { if(confirm("Удалить?")) { const roomId = (activeChatType==='private'||activeChatType==='saved')?activeChat:`chat_${activeChat}`; await deleteDoc(doc(db, "rooms", roomId, "msgs", id)); showToast("Удалено"); } };
    window.editMsg = async (id, oldVal) => {
        const newVal = prompt("Редактировать:", oldVal); if(newVal && newVal!==oldVal) {
            const roomId = (activeChatType==='private'||activeChatType==='saved')?activeChat:`chat_${activeChat}`;
            await updateDoc(doc(db, "rooms", roomId, "msgs", id), { val: newVal }); showToast("Изменено");
        }
    };
    window.copyMsg = (text) => { navigator.clipboard?.writeText(text); showToast("Скопировано!"); };

    document.getElementById('f-up').onchange = async (e) => {
        const file = e.target.files[0]; if(!file) return;
        showToast("Загрузка...");
        const fd = new FormData(); fd.append('image', file);
        const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd });
        const d = await r.json();
        if(d.success) sendMsg(file.type.startsWith('video')?'video':'img', d.data.url);
        e.target.value = '';
    };

    window.toggleRecord = async () => {
        const btn = document.getElementById('mic-btn');
        if(!recorder) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream); audioChunks = [];
            recorder.ondataavailable = e => audioChunks.push(e.data);
            recorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader(); reader.readAsDataURL(blob);
                reader.onloadend = () => sendMsg('voice', reader.result);
                btn.classList.remove('recording');
                showToast("Голосовое отправлено!");
            };
            recorder.start(); btn.classList.add('recording');
        } else { recorder.stop(); recorder = null; }
    };

    document.addEventListener('click', (e) => { if(!e.target.closest('#create-menu') && !e.target.closest('.side-header span:last-child')) document.getElementById('create-menu').style.display = 'none'; });
</script>
</body>
</html>
